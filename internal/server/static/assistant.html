<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistant — mustra</title>
<link rel="icon" href="/static/brand/favicon.ico" sizes="any">
<link rel="icon" href="/static/brand/app-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/brand/app-icon-256.png">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/theme.js"></script>
<style>
  .as-wrap { max-width: 920px; }
  .as-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .as-bar label { font-size: var(--fs-meta); color: var(--text-muted); }
  .as-bar select { padding: 6px 10px; border-radius: var(--radius-md); border: 1px solid var(--border-input); background: var(--input-bg); color: var(--text); font: inherit; font-size: 13px; }
  .as-bar .as-spacer { flex: 1; }
  .as-notice { font-size: var(--fs-meta); color: var(--text-muted); line-height: 1.5; margin: 0 0 12px; }
  .as-log { display: flex; flex-direction: column; gap: 12px; min-height: 160px; margin-bottom: 12px; }
  .as-empty { color: var(--text-muted); font-size: 13px; line-height: 1.6; padding: 18px 4px; }
  .as-empty ul { margin: 8px 0 0; padding-left: 18px; }
  .as-empty li { margin: 2px 0; }
  .as-empty button { display: block; width: auto; min-height: 0; background: none; border: 0; padding: 0; color: var(--accent); font: inherit; cursor: pointer; text-align: left; }
  .as-empty button:hover { text-decoration: underline; }
  .as-msg { border: 1px solid var(--border); border-radius: var(--radius-md); padding: 10px 14px; line-height: 1.55; font-size: 13.5px; overflow-wrap: anywhere; }
  .as-msg.user { background: var(--surface-2); align-self: flex-end; max-width: 85%; white-space: pre-wrap; }
  .as-msg.assistant { background: var(--surface); }
  .as-msg.error { border-color: var(--off); color: var(--off); }
  .as-who { display: block; font-size: var(--fs-meta); color: var(--text-muted); margin-bottom: 4px; font-weight: 600; }
  .as-md p { margin: 0 0 8px; }
  .as-md p:last-child { margin-bottom: 0; }
  .as-md ul, .as-md ol { margin: 0 0 8px; padding-left: 20px; }
  .as-md h3, .as-md h4 { font-size: 14px; margin: 10px 0 6px; }
  .as-md code { font-family: var(--mono); font-size: 12px; background: var(--surface-2); border-radius: var(--radius-sm); padding: 1px 4px; }
  .as-md pre { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 10px; overflow-x: auto; margin: 0 0 8px; }
  .as-md pre code { background: none; padding: 0; }
  .as-md table { border-collapse: collapse; margin: 0 0 8px; font-size: 12.5px; }
  .as-md th, .as-md td { border: 1px solid var(--border); padding: 3px 8px; text-align: left; }
  .as-tools { margin-top: 8px; font-size: var(--fs-meta); }
  .as-tools summary { cursor: pointer; color: var(--text-muted); }
  .as-tool { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; padding: 6px 0; border-top: 1px solid var(--border); }
  .as-tool:first-of-type { border-top: 0; }
  .as-tool b { font-family: var(--mono); font-weight: 600; }
  .as-tool pre { grid-column: 1 / -1; margin: 0; font-family: var(--mono); font-size: 11.5px; white-space: pre-wrap; color: var(--text-muted); }
  .as-tag { font-size: 11px; padding: 1px 7px; border-radius: 999px; justify-self: start; }
  .as-tag.ok { background: var(--ok-bg); color: var(--ok); }
  .as-tag.bad { background: var(--off-bg); color: var(--off); }
  .as-tag.ask { background: color-mix(in srgb, var(--viz-warning) 22%, transparent); color: var(--warn); }
  .as-stopped { margin-top: 6px; font-size: var(--fs-meta); color: var(--warn); }
  .as-form { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
  .as-form button { flex: 0 0 auto; width: auto; }
  .as-form textarea { flex: 1 1 240px; min-width: 0; min-height: 64px; max-height: 240px; resize: vertical; padding: 9px 11px; border-radius: var(--radius-md); border: 1px solid var(--border-input); background: var(--input-bg); color: var(--text); font: inherit; font-size: 13.5px; }
  .as-status { font-size: var(--fs-meta); color: var(--text-muted); min-height: 18px; margin-top: 6px; }
  .as-off { padding: 16px; font-size: 13.5px; line-height: 1.6; }
</style>
</head>
<body>
  <div class="app-shell">
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <aside class="sidebar-rail" id="sidebar-rail"></aside>
    <aside class="sidebar-flyout" id="sidebar-flyout"></aside>
    <main>
      <div id="assistant-page-head"></div>
      <div class="panel as-wrap" id="as-panel">
        <div class="as-off" id="as-loading">loading…</div>
        <div id="as-main" hidden>
          <div class="as-bar">
            <label for="as-conn">Model</label>
            <select id="as-conn"></select>
            <span class="as-spacer"></span>
            <button class="tiny" type="button" id="as-new">New conversation</button>
          </div>
          <p class="as-notice" id="as-notice"></p>
          <div class="as-log" id="as-log" aria-live="polite"></div>
          <form class="as-form" id="as-form">
            <label for="as-input" class="sr-only">Your question</label>
            <textarea id="as-input" placeholder="Ask about your endpoints, vulnerabilities, deployments…" required></textarea>
            <button class="primary" type="submit" id="as-send">Send</button>
          </form>
          <div class="as-status" id="as-status" role="status"></div>
        </div>
      </div>
    </main>
  </div>

<script src="/static/app.js"></script>
<script>
// The conversation lives in this page only: closing it ends it. Each turn
// sends the whole text conversation; the server runs the model and its tool
// calls and answers with the reply and which tools it called.
let convo = [];
let busy = false;
const log = document.getElementById("as-log");

const EXAMPLES = [
  "What needs my attention today?",
  "Which endpoints have critical vulnerabilities that are known to be exploited?",
  "How did the most recent deployment go? Which devices failed or timed out?",
  "Which Linux endpoints are offline?",
];

document.addEventListener("mustra:user", async () => {
  renderPageHead("assistant-page-head", "/assistant", { title: "Assistant" });
  const r = await fetch("/api/ai/status");
  const loading = document.getElementById("as-loading");
  if (!r.ok) { loading.textContent = "Could not load the assistant: " + (await r.text()); return; }
  const st = await r.json();
  if (!st.available) { loading.textContent = st.reason || "The assistant is not available."; return; }
  loading.hidden = true;
  document.getElementById("as-main").hidden = false;
  document.getElementById("as-notice").textContent = st.notice +
    " Tools run with your own permissions. Anything it asks to change waits for somebody else to approve it.";
  const sel = document.getElementById("as-conn");
  sel.innerHTML = st.connections.map(c =>
    `<option value="${escapeHtml(c.id)}">${escapeHtml(c.name)} · ${escapeHtml(c.model)}${c.self_hosted ? " (self-hosted)" : ""}</option>`).join("");
  renderLog();
});

document.getElementById("as-new").addEventListener("click", () => { convo = []; renderLog(); document.getElementById("as-input").focus(); });
document.getElementById("as-form").addEventListener("submit", e => { e.preventDefault(); send(); });
document.getElementById("as-input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});

async function send(text) {
  const input = document.getElementById("as-input");
  const q = (text || input.value).trim();
  if (!q || busy) return;
  busy = true;
  input.value = "";
  convo.push({ role: "user", content: q });
  renderLog();
  const status = document.getElementById("as-status");
  const btn = document.getElementById("as-send");
  btn.disabled = true;
  status.textContent = "Thinking… the assistant may call several tools.";
  try {
    const r = await fetch("/api/ai/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ connection_id: document.getElementById("as-conn").value,
        messages: convo.filter(m => m.role === "user" || m.role === "assistant").map(m => ({ role: m.role, content: m.content })) }),
    });
    if (!r.ok) {
      convo.push({ role: "error", content: (await r.text()).trim() || ("HTTP " + r.status) });
    } else {
      const data = await r.json();
      convo.push({ role: "assistant", content: data.reply || "(no answer)", tools: data.tool_calls || [], stopped: data.stopped || "", connection: data.connection });
    }
  } catch (err) {
    convo.push({ role: "error", content: "Could not reach the server: " + err });
  }
  busy = false;
  btn.disabled = false;
  status.textContent = "";
  renderLog();
  input.focus();
}

function renderLog() {
  if (convo.length === 0) {
    log.innerHTML = `<div class="as-empty">Ask a question about your fleet. For example:<ul>${EXAMPLES.map(x =>
      `<li><button type="button" data-example="${escapeHtml(x)}">${escapeHtml(x)}</button></li>`).join("")}</ul></div>`;
    log.querySelectorAll("[data-example]").forEach(b => b.addEventListener("click", () => send(b.dataset.example)));
    return;
  }
  log.innerHTML = convo.map(m => {
    if (m.role === "user") return `<div class="as-msg user"><span class="as-who">You</span>${escapeHtml(m.content)}</div>`;
    if (m.role === "error") return `<div class="as-msg error" role="alert"><span class="as-who">Error</span>${escapeHtml(m.content)}</div>`;
    return `<div class="as-msg assistant"><span class="as-who">Assistant${m.connection ? " · " + escapeHtml(m.connection) : ""}</span>
      <div class="as-md">${/* safe-html: renderMarkdown escapes every character first */ renderMarkdown(m.content)}</div>
      ${m.stopped ? `<div class="as-stopped">Stopped: ${escapeHtml(m.stopped)}</div>` : ""}
      ${toolsHTML(m.tools)}</div>`;
  }).join("");
  log.lastElementChild.scrollIntoView({ block: "nearest" });
}

function toolsHTML(tools) {
  if (!tools || tools.length === 0) return "";
  const asked = tools.filter(t => t.action && t.ok).length;
  return `<details class="as-tools"${asked ? " open" : ""}><summary>${/* safe-html: a number */ tools.length} tool call${tools.length === 1 ? "" : "s"}${/* safe-html: a number and fixed words */ asked ? ` · ${asked} approval request${asked === 1 ? "" : "s"} filed` : ""}</summary>
    ${tools.map(t => `<div class="as-tool"><b>${escapeHtml(t.tool)}</b>${t.ok
      ? (t.action ? '<span class="as-tag ask">approval requested</span>' : '<span class="as-tag ok">ok</span>')
      : '<span class="as-tag bad">refused</span>'}
      <pre>${escapeHtml(JSON.stringify(t.arguments || {}))}${t.error ? "\n" + escapeHtml(t.error) : ""}</pre></div>`).join("")}</details>`;
}

// renderMarkdown turns the model's Markdown into HTML. Every character is
// escaped first, so nothing the model writes becomes markup; only the
// tags added here exist, and a link is kept only for http(s) or a
// console path.
function renderMarkdown(src) {
  const lines = String(src).replace(/\r\n/g, "\n").split("\n");
  const out = [];
  let para = [], list = null, inCode = false, code = [], table = [];
  const flushPara = () => { if (para.length) { out.push("<p>" + para.map(inline).join("<br>") + "</p>"); para = []; } };
  const flushList = () => { if (list) { out.push(`<${/* safe-html: "ul" or "ol" */ list.tag}>` + list.items.map(i => "<li>" + inline(i) + "</li>").join("") + `</${/* safe-html: "ul" or "ol" */ list.tag}>`); list = null; } };
  const flushTable = () => {
    if (!table.length) return;
    const rows = table.filter(r => !/^\s*\|?\s*:?-{2,}/.test(r)).map(r => r.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|"));
    out.push("<table>" + rows.map((cells, i) => "<tr>" + cells.map(c => (i === 0 ? "<th>" : "<td>") + inline(c.trim()) + (i === 0 ? "</th>" : "</td>")).join("") + "</tr>").join("") + "</table>");
    table = [];
  };
  const flushAll = () => { flushPara(); flushList(); flushTable(); };
  for (const line of lines) {
    if (/^\s*```/.test(line)) {
      if (inCode) { out.push("<pre><code>" + escapeHtml(code.join("\n")) + "</code></pre>"); code = []; inCode = false; }
      else { flushAll(); inCode = true; }
      continue;
    }
    if (inCode) { code.push(line); continue; }
    let m;
    if (/^\s*\|.*\|\s*$/.test(line)) { flushPara(); flushList(); table.push(line); continue; }
    flushTable();
    if (!line.trim()) { flushPara(); flushList(); continue; }
    if ((m = line.match(/^(#{1,6})\s+(.*)$/))) { flushAll(); out.push(`<h${m[1].length <= 2 ? 3 : 4}>` + inline(m[2]) + `</h${m[1].length <= 2 ? 3 : 4}>`); continue; }
    if ((m = line.match(/^\s*[-*+]\s+(.*)$/)) || (m = line.match(/^\s*\d+[.)]\s+(.*)$/))) {
      const tag = /^\s*\d/.test(line) ? "ol" : "ul";
      flushPara();
      if (!list || list.tag !== tag) { flushList(); list = { tag, items: [] }; }
      list.items.push(m[1]);
      continue;
    }
    flushList();
    para.push(line);
  }
  if (inCode) out.push("<pre><code>" + escapeHtml(code.join("\n")) + "</code></pre>");
  flushAll();
  return out.join("");
}

// inline escapes a span of text, then adds code, bold, italics and links.
function inline(text) {
  const codes = [];
  let s = String(text).replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
  s = escapeHtml(s);
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (all, label, href) => {
    const raw = href.replace(/&amp;/g, "&");
    if (/^https?:\/\//i.test(raw)) return `<a href="${escapeHtml(safeUrl(raw))}" target="_blank" rel="noopener noreferrer">${/* safe-html: escaped with the whole line above */ label}</a>`;
    if (/^\/(?!\/)/.test(raw)) return `<a href="${escapeHtml(safeUrl(raw))}">${/* safe-html: escaped with the whole line above */ label}</a>`;
    return all;
  });
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => "<code>" + escapeHtml(codes[+i]) + "</code>");
}
</script>
</body>
</html>

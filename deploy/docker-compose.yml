# mustra control plane.
#
# NATS (JetStream, TLS, a server credential and per-agent identities
# decided by the server through the broker's auth callout), Postgres, and the mustra server
# (API + console UI). Nothing here terminates TLS for the console: put your
# own reverse proxy or the optional Cloudflare Tunnel (profile "tunnel",
# below) in front of port 8080 for public access.
#
# First time:
#   ./init.sh                  # writes .env with real secrets, generates the
#                              # NATS certificates, detects your LAN address
#   docker compose up -d --build
#
# Later:
#   docker compose up -d --build           # rebuild from source
#   docker compose pull && docker compose up -d   # use a published image
#   docker compose --profile tunnel up -d  # also start cloudflared
#
# Local development runs only nats and postgres from compose.dev.yml and
# the server from `go run` -- see docs/DEVELOPMENT.md.

services:
  script-tools:
    image: ghcr.io/mustra-dev/mustra-script-tools:${MUSTRA_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.script-tools
    networks: [script-tools]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=1024m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1536m
    pids_limit: 192
    cpus: 2
    init: true
    restart: unless-stopped

  nats:
    image: nats:2.15-alpine
    # The system-account user (nats.conf) must never get an empty password:
    # when MUSTRA_NATS_SYS_PASSWORD is unset (an install from before it
    # existed), NATS starts with a random one nobody knows, and revoked
    # agents are cut off when their JWT expires instead of at once.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$MUSTRA_NATS_SYS_PASSWORD" ]; then
          MUSTRA_NATS_SYS_PASSWORD=$$(head -c 32 /dev/urandom | base64 | tr -d '/+=')
          export MUSTRA_NATS_SYS_PASSWORD
        fi
        exec nats-server -c /etc/nats/nats.conf
    environment:
      MUSTRA_NATS_SERVER_PASSWORD: ${MUSTRA_NATS_SERVER_PASSWORD}
      MUSTRA_NATS_SYS_PASSWORD: ${MUSTRA_NATS_SYS_PASSWORD:-}
      # The public half of the auth-callout key: the broker accepts agent
      # authorizations signed by the server's seed (MUSTRA_NATS_CALLOUT_SEED,
      # which only the server sees). The agent password no longer reaches
      # the broker at all; legacy agents are decided by the server.
      MUSTRA_NATS_CALLOUT_ISSUER: ${MUSTRA_NATS_CALLOUT_ISSUER:?run ./init.sh to generate the NATS auth callout key (upgrade step, see README)}
    volumes:
      - nats-data:/data
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
      # Generated by nats/gen-certs.sh (init.sh runs it). NATS refuses to
      # start without them, and the server waits on NATS.
      - ./nats/certs:/etc/nats/certs:ro
    ports:
      # Client port (agents connect here). The host side follows
      # MUSTRA_NATS_PORT, which init.sh records when it is not 4222.
      - "${MUSTRA_NATS_PORT:-4222}:4222"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    # Postgres 18 moved its default PGDATA to /var/lib/postgresql/<major>/docker
    # and its VOLUME to /var/lib/postgresql. Setting PGDATA back to the 16-era
    # path keeps the existing postgres-data volume as the cluster directory.
    # Without it the entrypoint finds nothing at the new path, runs initdb, and
    # the stack comes up healthy on an empty database while the real one sits
    # untouched in the volume -- a silent data loss, not an error.
    #
    # A major upgrade is not in-place: 18 refuses to start on a 16 cluster.
    # Dump with the old image and restore into the new one (deploy/README.md).
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # There is deliberately no VictoriaMetrics and no MinIO here.
  #
  # Both were scaffolded early for plans that went elsewhere: performance
  # metrics are a sensor and live in Postgres beside every other answer, and
  # package payloads are a named volume (see package-files below) rather than
  # an object store, because a 400 MB MSI in an S3 bucket needs credentials,
  # lifecycle rules and a second failure mode to deliver what a directory
  # already delivers. Nothing in the codebase ever referenced either service.
  # They ran for months, held 200 KB between them, and published three ports.

  # The server runs as uid 65532. Volumes it created while it still ran as
  # root belong to root, so this one-shot re-owns them before each start; a
  # no-op once they are right. No network, and only the chown capabilities.
  data-owner:
    image: ghcr.io/mustra-dev/mustra:${MUSTRA_IMAGE_TAG:-latest}
    user: "0:0"
    # The recordings volume belongs to guacd (uid 1000), which writes it;
    # only its top is owned here, never the recordings, so a large one costs
    # nothing. Whichever container makes the volume first, it ends up right.
    entrypoint: ["sh", "-c", "chown -R 65532:65532 /var/lib/mustra/output /var/lib/mustra/package-files && chown 1000:1000 /remote-recordings"]
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    healthcheck:
      disable: true
    volumes:
      - package-files:/var/lib/mustra/package-files
      - output:/var/lib/mustra/output
      - remote-recordings:/remote-recordings
    restart: "no"

  server:
    networks: [default, script-tools]
    # `image` names what a release publishes (see .github/workflows/release.yml)
    # and what `--build` tags locally, so the two paths produce the same
    # thing under the same name.
    image: ghcr.io/mustra-dev/mustra:${MUSTRA_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
      args:
        MUSTRA_VERSION: ${MUSTRA_VERSION:-dev}
        MUSTRA_AGENT_VERSION: ${MUSTRA_AGENT_VERSION:-}
        MUSTRA_COMMIT: ${MUSTRA_COMMIT:-}
        MUSTRA_BUILD_TIME: ${MUSTRA_BUILD_TIME:-}
    # Every MUSTRA_* setting in .env reaches the server as-is, and the
    # server reads the pre-rename BEACON_* names too, so an older .env keeps
    # working. Only the values compose has to derive are listed below.
    env_file: .env
    environment:
      MUSTRA_SCRIPT_TOOLS_URL: http://script-tools:8091
      MUSTRA_NATS_URL: tls://nats:4222
      MUSTRA_NATS_CA: /etc/nats/certs/ca.crt
      MUSTRA_NATS_USER: mustra-server
      MUSTRA_NATS_PASSWORD: ${MUSTRA_NATS_SERVER_PASSWORD}
      # The legacy shared agent password. Never handed out any more; the
      # server only checks agents that still hold it from an older install,
      # while Settings allows it, so they can move to their own credential.
      MUSTRA_AGENT_NATS_USER: mustra-agent
      MUSTRA_AGENT_NATS_PASSWORD: ${MUSTRA_NATS_AGENT_PASSWORD:-}
      MUSTRA_POSTGRES_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    volumes:
      # Only the CA certificate: the server verifies the broker with it, and
      # has no use for the CA or broker private keys beside it.
      - ./nats/certs/ca.crt:/etc/nats/certs/ca.crt:ro
      # Package files: the payloads staged to endpoints. A named volume
      # rather than the database, because a 400 MB MSI in a Postgres row is
      # carried by every backup and every replica thereafter.
      - package-files:/var/lib/mustra/package-files
      # Anything mustra writes to disk on request: rendered reports, Connect
      # file exports. Without a volume these land in the container's own
      # filesystem and vanish on the next deploy, which is a trap rather
      # than a limitation -- the operator asked for a file.
      - output:/var/lib/mustra/output
      # Remote desktop recordings, written by guacd (below) and only read
      # here. guacd makes them readable by its group (gid 1000), which is
      # why the server is in it.
      - remote-recordings:/remote-recordings:ro
    group_add: ["1000"]
    ports:
      # The console. Sign in here directly only with MUSTRA_COOKIE_SECURE=false
      # (init.sh's default); with it true, a browser will not send the session
      # cookie over plain HTTP and the login silently does not stick.
      # The host side follows MUSTRA_CONSOLE_PORT (see init.sh).
      - "${MUSTRA_CONSOLE_PORT:-8080}:8080"
    depends_on:
      data-owner:
        condition: service_completed_successfully
      script-tools:
        condition: service_healthy
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # So `docker compose up -d --wait` returns when the console is actually
    # answering, not when the container started. The first boot applies the
    # schema, hence the generous start period.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  # Optional: public HTTPS via a Cloudflare Tunnel. Off unless you ask for
  # it (`docker compose --profile tunnel up -d`), because it needs a tunnel
  # you created and a credentials file that only you have -- see
  # cloudflared/config.yml. Any reverse proxy that forwards to :8080 works
  # just as well.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    profiles: ["tunnel"]
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      # MUSTRA_CLOUDFLARED_CONFIG points at your own copy (config.local.yml
      # is ignored by git), so updating the checkout never replaces it with
      # the placeholder template.
      - ${MUSTRA_CLOUDFLARED_CONFIG:-./cloudflared/config.yml}:/etc/cloudflared/config.yml:ro
      - ./cloudflared/creds.json:/etc/cloudflared/creds.json:ro
    depends_on:
      - server
    restart: unless-stopped

  # Optional: remote desktop (RDP, VNC, SSH) in the browser through Apache
  # Guacamole. Off unless asked for (`docker compose --profile remote up -d
  # guacd guacamole`). No port is published: the mustra server serves it at
  # /guacamole/ to signed-in users, and Guacamole opens only connections the
  # server signs with MUSTRA_GUACAMOLE_JSON_SECRET (openssl rand -hex 16),
  # which is also entered under Access → Jump Gate → Remote desktop.
  guacd:
    image: guacamole/guacd:1.6.0
    profiles: ["remote"]
    # Session recordings go to recordings/ under guacd's home. data-owner
    # gives the volume to guacd (uid 1000) before either container starts.
    volumes:
      - remote-recordings:/home/guacd
    depends_on:
      data-owner:
        condition: service_completed_successfully
    restart: unless-stopped
  guacamole:
    image: guacamole/guacamole:1.6.0
    profiles: ["remote"]
    environment:
      GUACD_HOSTNAME: guacd
      JSON_ENABLED: "true"
      JSON_SECRET_KEY: ${MUSTRA_GUACAMOLE_JSON_SECRET:-}
    depends_on:
      - guacd
    restart: unless-stopped

volumes:
  package-files:
  output:
  remote-recordings:
  nats-data:
  postgres-data:

# The tools have no external route and cannot reach NATS or Postgres.
networks:
  script-tools:
    internal: true
